      - name: Compile NodeJhora JS engine (Vedic — Shadbala/Ashtakavarga/Yoga/KP, 纯JS)
        run: |
          mkdir -p /tmp/nodejhora_build && cd /tmp/nodejhora_build
          npm install @node-jhora/core@2.1.0 @node-jhora/analytics@2.1.0 @node-jhora/prediction@2.1.0 2>&1 | tail -3
          echo 'export * from "@node-jhora/core";' > jhora-entry.mjs
          echo 'export * from "@node-jhora/analytics";' >> jhora-entry.mjs
          echo 'export * from "@node-jhora/prediction";' >> jhora-entry.mjs
          npx esbuild jhora-entry.mjs --bundle --platform=node --format=iife --global-name=NodeJhora --target=es2020 --outfile=node-jhora-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp node-jhora-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "NodeJhora compiled: $(wc -c < node-jhora-engine.js) bytes"

      - name: Compile Iztro JS engine (SylarLong/iztro ⭐3841 — 紫微斗数权威引擎)
        run: |
          mkdir -p /tmp/iztro_build
          cd /tmp && npm pack iztro --pack-destination /tmp/iztro_build 2>&1
          cd /tmp/iztro_build && tar xzf iztro-*.tgz && cd package
          # iztro 核心9个模块依赖 lunar-lite(农历转换), 必须安装
          npm install lunar-lite 2>&1 | tail -1
          # iztro 是 CJS 模块, lib/index.js 导出 { astro, star, data, util }
          echo 'module.exports = require("./lib/index");' > iztro-entry.cjs
          npx esbuild iztro-entry.cjs --bundle --platform=node --format=iife --global-name=Iztro --target=es2020 --tree-shaking=false --outfile=iztro-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
