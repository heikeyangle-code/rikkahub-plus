name: Build APK

on:
  push:
    branches: [ master, mingli ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Upgrade pip & setuptools (required for git+ packages)
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Make offline_pkgs discoverable by pip and install Rust for pydantic-core
        run: |
          echo "PIP_FIND_LINKS=file://${GITHUB_WORKSPACE}/app/offline_pkgs" >> $GITHUB_ENV
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          echo "Rust installed: $(rustc --version)"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Download packages missing from Chaquopy proxy
        run: |
          pip download --no-deps --no-binary :all: "lunar-python" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pydantic-core" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pydantic" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "PyYAML" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "timezonefinder" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "flatbuffers" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "MarkupSafe" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pytz" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps "simple-ascii-tables" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "python-dateutil" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "six" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "geopy" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "geographiclib" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "requests-cache" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "attrs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "cattrs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "platformdirs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "url-normalize" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "urllib3" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "jinja2" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "cn2an" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "proces" -d /tmp/pypi-offline 2>&1 | tail -3
          # 去掉 numpy/h3/cffi 依赖 (CFFI加速模块需要,纯Python回退不需要)
          cd /tmp/pypi-offline
          tar xfz timezonefinder-*.tar.gz && rm timezonefinder-*.tar.gz
          python3 ${GITHUB_WORKSPACE}/ci/patch_timezonefinder.py timezonefinder-*/
          tar czf timezonefinder-8.2.4.tar.gz timezonefinder-* && rm -rf timezonefinder-8.2.4
          cd ${GITHUB_WORKSPACE}
          # ichingshifa: PyPI 残缺版缺20函数, 从 GitHub 拉完整源码 + 补 setup.py
          git clone --depth 1 https://github.com/kentang2017/ichingshifa.git /tmp/ichingshifa_src 2>&1 | tail -3
          cd /tmp/ichingshifa_src
          printf 'from setuptools import setup, find_packages; setup(name="ichingshifa", version="0.1", packages=find_packages("src"), package_dir={"": "src"}, include_package_data=True)' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets (SystemRandom uses OS entropy)
          sed -i 's/\brandom\.sample(/secrets.SystemRandom().sample(/g' src/ichingshifa/ichingshifa.py
          sed -i 's/import pickle, random,/import pickle, secrets,/' src/ichingshifa/ichingshifa.py
          # 纯 Python 替换 numpy (np.array_split)
          python3 ${GITHUB_WORKSPACE}/ci/patch_pyjhora_numpy.py /tmp/ichingshifa_src/src/
          tar czf /tmp/pypi-offline/ichingshifa-src.tar.gz --exclude=".git" . 2>&1
          cd /tmp && rm -rf /tmp/ichingshifa_src
          echo "ichingshifa full tarball ready"

          # kinliuren (大六壬): PyPI空壳, GitHub克隆+注入setup.py
          git clone --depth 1 https://github.com/kentang2017/kinliuren.git /tmp/kinliuren_src 2>&1 | tail -1
          cd /tmp/kinliuren_src
          python3 -c "import sys; data=open(sys.argv[1],'rb').read(); open(sys.argv[1],'wb').write(data.replace(b'\xef\xbb\xbf', b''))" src/kinliuren/__init__.py
          printf 'from setuptools import setup, find_packages; setup(name="kinliuren", version="0.1", packages=find_packages("src"), package_dir={"": "src"}, include_package_data=True)' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          tar czf /tmp/pypi-offline/kinliuren-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/kinliuren_src

          # kintaiyi (太乙神数): PyPI空壳, GitHub克隆+注入setup.py
          git clone --depth 1 https://github.com/kentang2017/kintaiyi.git /tmp/kintaiyi_src 2>&1 | tail -1
          cd /tmp/kintaiyi_src
          printf 'from setuptools import setup, find_packages; setup(name="kintaiyi", version="0.1", packages=find_packages("src"), package_dir={"": "src"}, include_package_data=True)' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          tar czf /tmp/pypi-offline/kintaiyi-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/kintaiyi_src

          # taixuanshifa (太玄筮法): PyPI空壳, GitHub克隆+注入setup.py (根目录.py, 非src/)
          git clone --depth 1 https://github.com/kentang2017/taixuanshifa.git /tmp/taixuanshifa_src 2>&1 | tail -1
          cd /tmp/taixuanshifa_src
          printf 'from setuptools import setup; setup(name="taixuanshifa", version="0.1", py_modules=["taixuanshifa", "app"])' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets
          sed -i 's/\brandom\.sample(/secrets.SystemRandom().sample(/g' taixuanshifa.py
          sed -i 's/import random, pickle,/import secrets, pickle,/' taixuanshifa.py
          python3 ${GITHUB_WORKSPACE}/ci/patch_taixuanshifa_inject.py taixuanshifa.py
          grep "pan_from_code" taixuanshifa.py && echo "OK: pan_from_code injected" || echo "FAIL: injection missed"
          tar czf /tmp/pypi-offline/taixuanshifa-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/taixuanshifa_src

          # jingjue (荆诀/北大简先秦占卜): PyPI空壳, GitHub克隆+注入setup.py (根目录.py, 非src/)
          git clone --depth 1 https://github.com/kentang2017/jingjue.git /tmp/jingjue_src 2>&1 | tail -1
          cd /tmp/jingjue_src
          printf 'from setuptools import setup; setup(name="jingjue", version="0.1", py_modules=["jingjue"])' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets
          _random_to_secrets() { sed -i -e 's/random\.sample(/secrets.SystemRandom().sample(/g' -e 's/random\.choice(/secrets.choice(/g' -e 's/\bimport random\b/import secrets/' -e 's/, random,/, secrets,/g' "$1"; }
          _random_to_secrets "jingjue.py"
          tar czf /tmp/pypi-offline/jingjue-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/jingjue_src
          echo "4 kentang2017 packages cloned from GitHub"

          # meihua-yi: 梅花易数, 铜钱起卦用真随机
          pip download --no-deps --no-binary :all: "meihua-yi" -d /tmp/meihua_patch
          cd /tmp/meihua_patch
          tar xfz meihua_yi-*.tar.gz && rm meihua_yi-*.tar.gz
          SRC=$(ls -d meihua_yi-* | head -1)
          sed -i 's/^import random$/import secrets/' "$SRC/meihua_yi/engine.py"
          sed -i 's/random\.choice(/secrets.choice(/g' "$SRC/meihua_yi/engine.py"
          tar czf /tmp/pypi-offline/meihua-yi-patched.tar.gz "$SRC"
          cd /tmp && rm -rf /tmp/meihua_patch
          echo "Added meihua-yi-patched.tar.gz (random → secrets)"

          # arcanite: 塔罗引擎, 删掉LLM+PDF+图片以外的内容
          pip download --no-deps --no-binary :all: "arcanite==0.2.0" -d /tmp/pypi-offline 2>&1
          cd /tmp/pypi-offline
          sdist=$(ls arcanite-*.tar.gz | head -1)
          dir="${sdist%.tar.gz}"
          tar xfz "$sdist" && rm "$sdist"
          rm -rf "$dir/src/arcanite/interpretation"
          rm -rf "$dir/src/arcanite/render"
          rm -rf "$dir/src/arcanite/templates"
          rm -rf "$dir/src/arcanite/prompts"
          rm -f "$dir/src/arcanite/cards/update_card_positions.py"
          rm -rf "$dir/src/arcanite/images"
          rm -rf "$dir/examples"
          # 真随机: random.Random(seed) → secrets.SystemRandom() (seed=None 时走硬件熵)
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_random.py "$dir/src/arcanite/core/deck.py"
          # 用 printf 写 __init__.py，避免 YAML 解析 """ 报错
          printf '%s\n' '"""Arcanite - A Tarot Reading Engine (stripped: no LLM/PDF/images)"""' \
            '__version__ = "0.2.0"' \
            'from arcanite.core import (' \
            '    Card, CardInterpretation, Deck, DeckConfig, DrawnCard,' \
            '    Orientation, QuestionType, Reading, ReadingConfig,' \
            '    SpreadDefinition, SpreadLoader,' \
            ')' \
            'from arcanite.reading import ReadingEngine, create_reading' \
            'from arcanite.core.deck import TarotDeck, TarotCard, load_tarot_deck' \
            > "$dir/src/arcanite/__init__.py"
          tar czf "/tmp/pypi-offline/arcanite-stripped.tar.gz" "$dir"
          rm -rf "$dir"
          cd ${GITHUB_WORKSPACE}
          echo "arcanite stripped ready"

          # Rename files to match build.gradle.kts expectations (hyphen→underscore, version pin)
          mkdir -p app/offline_pkgs
          for f in /tmp/pypi-offline/*.tar.gz; do
            fname=$(basename "$f")
            # lunar-python → lunar_python (if any lunar-python files appear)
            fname="${fname//lunar-python/lunar_python}"
            cp "$f" "app/offline_pkgs/$fname"
          done
          for f in /tmp/pypi-offline/*.whl; do fname=$(basename "$f"); cp "$f" "app/offline_pkgs/$fname"; done
          # Rename unpinned packages to stable names for build.gradle.kts
          for f in app/offline_pkgs/pydantic-*.tar.gz; do cp "$f" "app/offline_pkgs/pydantic-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/lunar_python-*.tar.gz; do cp "$f" "app/offline_pkgs/lunar_python-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/timezonefinder-*.tar.gz; do cp "$f" "app/offline_pkgs/timezonefinder-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/flatbuffers-*.tar.gz; do cp "$f" "app/offline_pkgs/flatbuffers-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/markupsafe-*.tar.gz; do cp "$f" "app/offline_pkgs/markupsafe-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/pyyaml-*.tar.gz; do cp "$f" "app/offline_pkgs/pyyaml-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/pytz-*.tar.gz; do cp "$f" "app/offline_pkgs/pytz-latest.tar.gz" 2>/dev/null || true; done
          # simple_ascii_tables: .whl 改名会破坏 PEP 427 命名规范,保持原名 (resolve via fileTree glob in build.gradle.kts)
          for f in app/offline_pkgs/python_dateutil-*.tar.gz; do cp "$f" "app/offline_pkgs/python_dateutil-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/six-*.tar.gz; do cp "$f" "app/offline_pkgs/six-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/geopy-*.tar.gz; do cp "$f" "app/offline_pkgs/geopy-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/geographiclib-*.tar.gz; do cp "$f" "app/offline_pkgs/geographiclib-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/requests_cache-*.tar.gz; do cp "$f" "app/offline_pkgs/requests_cache-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/attrs-*.tar.gz; do cp "$f" "app/offline_pkgs/attrs-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/cattrs-*.tar.gz; do cp "$f" "app/offline_pkgs/cattrs-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/platformdirs-*.tar.gz; do cp "$f" "app/offline_pkgs/platformdirs-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/url_normalize-*.tar.gz; do cp "$f" "app/offline_pkgs/url_normalize-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/urllib3-*.tar.gz; do cp "$f" "app/offline_pkgs/urllib3-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/cn2an-*.tar.gz; do cp "$f" "app/offline_pkgs/cn2an-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/proces-*.tar.gz; do cp "$f" "app/offline_pkgs/proces-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/jinja2-*.tar.gz; do cp "$f" "app/offline_pkgs/jinja2-latest.tar.gz" 2>/dev/null || true; done
          echo "Offline packages:" && ls app/offline_pkgs/
      - name: Compile QiMen TS engine (bigfishmarquis-qimen)
        run: |
          git clone --depth 1 https://github.com/perfhelf/bigfishmarquis-qimen.git /tmp/qimen_ts
          cd /tmp/qimen_ts
          echo 'export { generate } from "./src/engine";' > entry.ts
          npm install esbuild typescript lunar-typescript 2>&1 | tail -3
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=QimenEngine --target=es2020 --outfile=qimen-engine.js 2>&1
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp qimen-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Qimen TS engine compiled: $(wc -c < qimen-engine.js) bytes"

      - name: Compile NiHaiXia ZiWei engine (Renhuai123/ziwei-doushu)
        run: |
          git clone --depth 1 https://github.com/Renhuai123/ziwei-doushu.git /tmp/ziwei_nhx
          cd /tmp/ziwei_nhx
          npm install 2>&1 | tail -3
          npm install esbuild typescript 2>&1 | tail -1
          # 完整打包: 算法 + 倪海厦解读 + 古籍
          echo 'export { generateChart, getLunarInfo } from "./lib/ziwei/algorithm";' > entry.ts
          echo 'export * from "./lib/nihai";' >> entry.ts
          echo 'export * from "./lib/classics";' >> entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=ZiweiNihai --target=es2020 --outfile=ziwei-nihai.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp ziwei-nihai.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "NiHaiXia ZiWei engine compiled: $(wc -c < ziwei-nihai.js) bytes"

      - name: Compile IchingShifa JS engine (Coaixy/ichingshifa)
        run: |
          git clone --depth 1 https://github.com/Coaixy/ichingshifa.git /tmp/iching_ts
          cd /tmp/iching_ts
          npm install 2>&1 | tail -3
          npm install esbuild typescript 2>&1 | tail -1
          # Patch Math.random -> crypto.getRandomValues (真随机起卦)
          echo 'function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}' > ~/crypto_random.js
          # 3处 patch:
          # decode.ts:242 Math.floor(Math.random()*5) -> cryptoRandInt(0,4)
          sed -i 's/Math\.floor(Math\.random() \* 5)/cryptoRandInt(0,4)/g' src/core/decode.ts
          # divination.ts:63 Math.floor(Math.random()*(max-min+1))
          sed -i 's/Math\.floor(Math\.random() \* (leftMax - leftMin + 1))/cryptoRandInt(0, leftMax - leftMin)/g' src/core/divination.ts
          # divination.ts:239 Math.floor(Math.random()*48)
          sed -i 's/Math\.floor(Math\.random() \* 48)/cryptoRandInt(0, 47)/g' src/core/divination.ts
          # Verify patch
          grep -n "Math.random" src/core/*.ts && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          echo 'export * from "./src/index";' > entry.ts
          cat ~/crypto_random.js >> entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=IchingShifa --target=es2020 --outfile=iching-shifa-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp iching-shifa-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "IchingShifa JS engine compiled: $(wc -c < iching-shifa-engine.js) bytes"

      - name: Compile TaiXuan JS engine (taixuan-lib)
        run: |
          mkdir -p /tmp/taixuan_ts
          cd /tmp && npm pack taixuan-lib --pack-destination /tmp/taixuan_ts 2>&1
          cd /tmp/taixuan_ts && tar xzf taixuan-lib-*.tgz && cd package
          # Patch 5处 Math.random -> crypto.getRandomValues
          # 1. randomDigit(): Math.floor(Math.random()*3)+1 -> cryptoRandInt(1,3)
          sed -i 's/Math\.floor(Math\.random() \* 3) + 1/cryptoRandInt(1,3)/g' dist/index.js
          # 2. generateByShi(): Math.floor(Math.random()*48)+1 -> cryptoRandInt(1,48)
          sed -i 's/Math\.floor(Math\.random() \* 48) + 1/cryptoRandInt(1,48)/g' dist/index.js
          # 3. generateByDice(): Math.floor(Math.random()*6)+1 -> cryptoRandInt(1,6)
          sed -i 's/Math\.floor(Math\.random() \* 6) + 1/cryptoRandInt(1,6)/g' dist/index.js
          # 4-5. generateByCoins(): Math.random()<0.5 -> cryptoRandInt(0,1)===1
          sed -i 's/Math\.random() < 0\.5/cryptoRandInt(0,1) === 1/g' dist/index.js
          grep -n "Math.random" dist/index.js && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          # Patch: expose 4-digit code in createResult return (for dual-engine shared random)
          # createResult originally returns {gua, timestamp} — add code field
          sed -i 's/return { gua: lookupByCode(code), timestamp: Date.now() };/return { gua: lookupByCode(code), timestamp: Date.now(), code: code.join("") };/g' dist/index.js
          grep "code:" dist/index.js && echo "OK: code field exposed" || echo "WARNING: code field patch failed"
          # Wrap with IIFE + crypto polyfill
          echo 'function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}' > taixuan-entry.js
          echo 'var TaixuanLib = (function(){' >> taixuan-entry.js
          echo 'var exports = {};' >> taixuan-entry.js
          cat dist/index.js >> taixuan-entry.js
          echo 'return exports;})();' >> taixuan-entry.js
          npx esbuild taixuan-entry.js --format=iife --global-name=TaixuanLib --target=es2020 --outfile=taixuan-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp taixuan-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "TaiXuan JS engine compiled: $(wc -c < taixuan-engine.js) bytes"

      - name: Compile Lunar standalone JS engine
        run: |
          cd /tmp && npm pack lunar-javascript --pack-destination /tmp/lunar_js 2>&1
          cd /tmp/lunar_js && tar xzf lunar-javascript-*.tgz && cd package
          # Export common classes
          echo 'export { Solar, SolarMonth, SolarWeek, SolarYear, SolarSeason, SolarHalfYear } from "./src/Solar";' > lunar-entry.js
          echo 'export { Lunar, LunarMonth, LunarYear, LunarTime } from "./src/Lunar";' >> lunar-entry.js
          echo 'export { EightChar } from "./src/EightChar";' >> lunar-entry.js
          echo 'export { DaYun } from "./src/DaYun";' >> lunar-entry.js
          echo 'export { LiuNian, LiuYue } from "./src/LiuNian";' >> lunar-entry.js
          echo 'export { JieQi } from "./src/JieQi";' >> lunar-entry.js
          echo 'export { NineStar } from "./src/NineStar";' >> lunar-entry.js
          echo 'export { HolidayUtil } from "./src/HolidayUtil";' >> lunar-entry.js
          npx esbuild lunar-entry.js --bundle --platform=node --format=iife --global-name=Lunar --target=es2020 --outfile=lunar-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp lunar-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Lunar standalone JS engine compiled: $(wc -c < lunar-engine.js) bytes"

      - name: Patch PyJHora (ephe path → pyswisseph)
        run: |
          pip download --no-deps --no-binary :all: "PyJHora" -d /tmp/pyjhora_patch
          cd /tmp/pyjhora_patch
          # pip normalizes package name to lowercase: pyjhora-*.tar.gz
          tar xfz pyjhora-*.tar.gz && rm pyjhora-*.tar.gz
          SRC_DIR=$(ls -d pyjhora-* | head -1)
          # PyJHora 自带 data/ephe/ 在 PyPI wheel 里是空的（受100MB限制）
          # 改为指向 pyswisseph 包内的星历，避免重复打包
          sed -i 's|swe.set_ephe_path(_ephe_path)|import swisseph; _ephe_path = os.path.join(os.path.dirname(swisseph.__file__), "ephe"); swe.set_ephe_path(_ephe_path)|' "$SRC_DIR/src/jhora/const.py"
          echo "Patched const.py:"
          grep -A1 "set_ephe_path" "$SRC_DIR/src/jhora/const.py"
          # 纯 Python 替换 numpy 依赖 (Android 嵌入场景无法安装 numpy C 扩展)
          python3 ${GITHUB_WORKSPACE}/ci/patch_pyjhora_numpy.py "$SRC_DIR/src/jhora/"
          cd /tmp/pyjhora_patch
          tar czf /tmp/pypi-offline/pyjhora-patched.tar.gz "$SRC_DIR"
          cp /tmp/pypi-offline/pyjhora-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          rm -rf /tmp/pyjhora_patch
          echo "Added pyjhora-patched.tar.gz"
      - name: Patch kinwangji (use setuptools + relax ephem pin)
        run: |
          git clone https://github.com/kentang2017/kinwangji.git /tmp/kinwangji_src
          cd /tmp/kinwangji_src
          rm -rf pic app.py data.pkl examples tests  # 只保留 kinwangji/ 核心代码 + jieqi.py wanji.py
          # Relax ephem version pin (Chaquopy has 4.2.1, not 4.1.6)
          sed -i 's/ephem>=4.1.6/ephem>=4.1.5/' pyproject.toml 2>/dev/null || sed -i 's/ephem>=4.1.6/ephem>=4.1.5/' setup.py 2>/dev/null || true
          # Switch from hatchling to setuptools (hatchling is empty stub on Chaquopy proxy)
          sed -i 's/requires = \["hatchling"\]/requires = ["setuptools>=61.0"]/' pyproject.toml
          sed -i 's/build-backend = "hatchling.build"/build-backend = "setuptools.build_meta"/' pyproject.toml
          printf '[tool.setuptools]\npackages = ["kinwangji"]' >> pyproject.toml
          echo "Patched kinwangji:"
          grep -E 'ephem|build-backend|requires' pyproject.toml | head -3
          cd /tmp && tar czf /tmp/pypi-offline/kinwangji-patched.tar.gz kinwangji_src
          cp /tmp/pypi-offline/kinwangji-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          echo "Added kinwangji-patched.tar.gz"
      - name: Patch stellium (relax timezonefinder pin)
        run: |
          pip download --no-deps --no-binary :all: stellium -d /tmp/st_patch
          cd /tmp/st_patch
          tar xfz stellium-*.tar.gz
          rm stellium-*.tar.gz
          cd stellium-*
          sed -i 's/timezonefinder>=6.5.0/timezonefinder>=3.4.2/' pyproject.toml
          # Remove deps unavailable on Chaquopy proxy
          sed -i '/"typst"/d' pyproject.toml
          sed -i '/"graphviz"/d' pyproject.toml
          echo "Patched stellium:"
          grep "timezonefinder" pyproject.toml
          cd /tmp/st_patch && tar czf /tmp/pypi-offline/stellium-patched.tar.gz stellium-*
          cp /tmp/pypi-offline/stellium-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          rm -rf /tmp/st_patch
          echo "Added stellium-patched.tar.gz"
      - name: Patch flatlib (relax pyswisseph pin to match provided version)
        run: |
          pip download --no-deps --no-binary :all: flatlib -d /tmp/fl_patch
          cd /tmp/fl_patch
          tar xfz flatlib-*.tar.gz
          rm flatlib-*.tar.gz
          cd flatlib-*
          sed -i 's/pyswisseph==2.08.00-1/pyswisseph>=2.10.3/' setup.py
          grep "pyswisseph" setup.py
          cd /tmp/fl_patch && tar czf /tmp/pypi-offline/flatlib-patched.tar.gz flatlib-*
          cp /tmp/pypi-offline/flatlib-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          rm -rf /tmp/fl_patch
          echo "Added flatlib-patched.tar.gz"
      - name: Patch immanuel (remove scipy/stubs dep, relax timezonefinder pin)
        run: |
          pip download --no-deps --no-binary :all: "immanuel" -d /tmp/imm_patch
          cd /tmp/imm_patch
          tar xfz immanuel-*.tar.gz
          rm immanuel-*.tar.gz
          cd immanuel-*
          sed -i '/"scipy"/d' pyproject.toml
          sed -i '/"scipy-stubs"/d' pyproject.toml  
          sed -i 's/timezonefinder~=5.2/timezonefinder>=3.4.2/' pyproject.toml
          echo "Patched immanuel deps:"
          grep -E 'timezonefinder|scipy' pyproject.toml || echo "(all clean)"
          cd /tmp/imm_patch && tar czf /tmp/pypi-offline/immanuel-patched.tar.gz immanuel-*
          cp /tmp/pypi-offline/immanuel-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          rm -rf /tmp/imm_patch
          echo "Added immanuel-patched.tar.gz"
      - name: Patch kerykeion (remove scour dep only — keep pydantic, we have it now)
        run: |
          pip download --no-deps --no-binary :all: kerykeion==5.9.0 -d /tmp/kerykeion_patch
          cd /tmp/kerykeion_patch
          tar xfz kerykeion-*.tar.gz
          rm kerykeion-*.tar.gz
          cd kerykeion-*
          # Only remove scour (SVG optimizer, not needed). Keep pydantic — we have it.
          sed -i '/"scour"/d' pyproject.toml
          echo "Patched kerykeion deps (scour removed, pydantic kept):"
          grep -E 'pydantic|scour' pyproject.toml || echo "(clean)"
          cd /tmp/kerykeion_patch && tar czf /tmp/pypi-offline/kerykeion-patched.tar.gz kerykeion-*
          cp /tmp/pypi-offline/kerykeion-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          rm -rf /tmp/kerykeion_patch
          echo "Added kerykeion-patched.tar.gz"
      - name: Patch kinqimen (GitHub clone + relax ephem pin)
        run: |
          # kinqimen (奇门遁甲): PyPI空壳, GitHub克隆+注入setup.py — Repo根目录 .py 文件 (无 src/)
          git clone --depth 1 https://github.com/kentang2017/kinqimen.git /tmp/kinqimen_src 2>&1 | tail -1
          cd /tmp/kinqimen_src
          printf 'from setuptools import setup; setup(name="kinqimen", version="0.1", py_modules=["kinqimen", "jieqi", "config", "cerebras_client", "angan"], include_package_data=True)' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # Relax ephem version pin
          sed -i 's/ephem==4.1.3/ephem>=4.1.3/' setup.py 2>/dev/null || echo "ephem pin not in setup.py"
          echo "Patched kinqimen:"
          grep -E 'ephem' setup.py pyproject.toml 2>/dev/null || echo "(no ephem ref)"
          cd /tmp && tar czf /tmp/pypi-offline/kinqimen-patched.tar.gz kinqimen_src
          cp /tmp/pypi-offline/kinqimen-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          rm -rf /tmp/kinqimen_src
          echo "Added kinqimen-patched.tar.gz from GitHub source"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Download Swiss Ephemeris data (pyswisseph needs ephe/ for planetary calc)
        run: |
          mkdir -p /tmp/ephe_cache
          cd /tmp/ephe_cache
          for f in seas_18.se1 semo_18.se1 sepl_18.se1 fixstars.cat seasnam.txt sefstars.txt seleapsec.txt seorbel.txt; do
            [ -f "$f" ] || curl -sL --http1.1 "https://raw.githubusercontent.com/naturalstupid/PyJHora/main/src/jhora/data/ephe/$f" -o "$f"
          done
          echo "Ephe files: $(ls -1 | wc -l) ($(du -sh . | cut -f1))"
      - name: Cross-compile ARM64 wheels (sxtwl, pyswisseph, pydantic-core, ephem)
        run: |
          python3 ci/cross_compile_wheels.py 2>&1
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
