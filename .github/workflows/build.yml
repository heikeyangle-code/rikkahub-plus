name: Build APK

on:
  push:
    branches: [ master, mingli, mingli2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip & setuptools (required for git+ packages)
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Make offline_pkgs discoverable by pip and install Rust for pydantic-core
        run: |
          echo "PIP_FIND_LINKS=file://${GITHUB_WORKSPACE}/app/offline_pkgs" >> $GITHUB_ENV
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          echo "Rust installed: $(rustc --version)"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Download packages missing from Chaquopy proxy
        run: |
          pip download --no-deps --no-binary :all: "lunar-python" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pydantic<2.0" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "PyYAML" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "MarkupSafe" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "attrs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "cattrs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "platformdirs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "url-normalize" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "urllib3" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "jinja2" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "cn2an" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "proces" -d /tmp/pypi-offline 2>&1 | tail -3
          # Strip C extensions from PyYAML & MarkupSafe — sdist compiles on x86_64 CI runner,
          # producing x86_64 .so files that can't load on ARM64 devices.
          # Both have pure-Python fallbacks; force those by removing ext_modules.
          for pkg in PyYAML MarkupSafe; do
            cd /tmp/pypi-offline
            tarball=$(ls ${pkg}-*.tar.gz 2>/dev/null | head -1)
            [ -z "$tarball" ] && continue
            tar xfz "$tarball" && rm "$tarball"
            srcdir=$(ls -d ${pkg}-* | head -1)
            sed -i 's/ext_modules=\[/ext_modules=\[\]  # /' "$srcdir/setup.py" 2>/dev/null || true
            sed -i 's/\[tool.setuptools.ext-modules\]/### [tool.setuptools.ext-modules]/' "$srcdir/pyproject.toml" 2>/dev/null || true
            tar czf "$tarball" "$srcdir" && rm -rf "$srcdir"
            echo "Patched $pkg: C extension disabled (pure Python fallback)"
            cd ${GITHUB_WORKSPACE}
          done
          # ichingshifa: PyPI 残缺版, GitHub克隆+补__init__.py+替换ephem.Date
          git clone --depth 1 https://github.com/kentang2017/ichingshifa.git /tmp/ichingshifa_src 2>&1 | tail -3
          cd /tmp/ichingshifa_src
          # Flatten: mv src/ichingshifa → ./ichingshifa (Chaquopy pip install broken with package_dir)
          mv src/ichingshifa ./ichingshifa && rm -rf src
          # Fix empty __init__.py (original is 1-byte newline → no exports)
          printf 'from .ichingshifa import *\nfrom .d import *\nfrom .jieqi import *\n' > ichingshifa/__init__.py
          printf 'from setuptools import setup; setup(name="ichingshifa", version="0.1", packages=["ichingshifa"], package_data={"ichingshifa": ["*.pkl"]})' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets (SystemRandom uses OS entropy)
          sed -i 's/\brandom\.sample(/secrets.SystemRandom().sample(/g' ichingshifa/ichingshifa.py
          sed -i 's/import pickle, random,/import pickle, secrets,/' ichingshifa/ichingshifa.py
          # ephem.Date → 纯Python: ephem 是已删C扩展, 只用到 Date() 解析日期字符串
          python3 ${GITHUB_WORKSPACE}/ci/patch_ichingshifa_ephem.py ichingshifa/ichingshifa.py
          # 纯 Python 替换 numpy (np.array_split)
          python3 ${GITHUB_WORKSPACE}/ci/patch_pyjhora_numpy.py /tmp/ichingshifa_src/ichingshifa/
          # jieqi.py: 重写为 lunar_python 实现 (ephem C扩展已删, Sun+Ecliptic+Equatorial全依赖ephem)
          python3 ${GITHUB_WORKSPACE}/ci/patch_ichingshifa_jieqi.py ichingshifa/jieqi.py
          # bookgua_string() + count_yy 干支校验
          python3 ${GITHUB_WORKSPACE}/ci/patch_ichingshifa_improve.py ichingshifa/ichingshifa.py
          tar czf /tmp/pypi-offline/ichingshifa-src.tar.gz --exclude=".git" . 2>&1
          cd /tmp && rm -rf /tmp/ichingshifa_src
          echo "ichingshifa full tarball ready (__init__ + ephem.Date patched + jieqi→lunar_python)"

          # kinliuren (大六壬): GitHub克隆,纯Python零依赖(146KB)
          git clone --depth 1 https://github.com/kentang2017/kinliuren.git /tmp/kinliuren_src 2>&1 | tail -1
          cd /tmp/kinliuren_src
          mv src/kinliuren ./kinliuren && rm -rf src
          # Fix empty __init__.py (original is 3-byte → no exports)
          printf 'from .kinliuren import *\n' > kinliuren/__init__.py
          # 干支参数校验: __init__ + all_sike 前置检查
          python3 ${GITHUB_WORKSPACE}/ci/patch_kinliuren_improve.py kinliuren/kinliuren.py
          printf 'from setuptools import setup; setup(name="kinliuren", version="0.1", packages=["kinliuren"])' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          tar czf /tmp/pypi-offline/kinliuren-0.1.2.9.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/kinliuren_src
          echo "kinliuren from GitHub ready (146KB, __init__ fixed)"

          # taixuanshifa (太玄筮法): PyPI空壳, GitHub克隆+注入setup.py
          # Fix: 用packages代替py_modules, data/自动随包部署 (py_modules不处理package_data)
          git clone --depth 1 https://github.com/kentang2017/taixuanshifa.git /tmp/taixuanshifa_src 2>&1 | tail -1
          cd /tmp/taixuanshifa_src
          mkdir -p taixuanshifa && mv taixuanshifa.py taixuanshifa/__init__.py && mv app.py taixuanshifa/ 2>/dev/null || true
          mv data taixuanshifa/data
          printf 'from setuptools import setup; setup(name="taixuanshifa", version="0.1", packages=["taixuanshifa"], package_data={"taixuanshifa": ["data/*"]})' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets
          sed -i 's/\brandom\.sample(/secrets.SystemRandom().sample(/g' taixuanshifa/__init__.py
          sed -i 's/import random, pickle,/import secrets, pickle,/' taixuanshifa/__init__.py
          # Fix: __file__ 路径适配新包结构
          sed -i 's|root = os.path.abspath(os.path.dirname(__file__))|root = os.path.dirname(os.path.abspath(__file__))|' taixuanshifa/__init__.py
          python3 ${GITHUB_WORKSPACE}/ci/patch_taixuanshifa_inject.py taixuanshifa/__init__.py
          grep "pan_from_code" taixuanshifa/__init__.py && echo "OK: pan_from_code injected" || echo "FAIL: injection missed"
          tar czf /tmp/pypi-offline/taixuanshifa-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/taixuanshifa_src

          # jingjue (荆诀/北大简先秦占卜): PyPI空壳, GitHub克隆+注入setup.py (根目录.py, 非src/)
          git clone --depth 1 https://github.com/kentang2017/jingjue.git /tmp/jingjue_src 2>&1 | tail -1
          cd /tmp/jingjue_src
          printf 'from setuptools import setup; setup(name="jingjue", version="0.1", py_modules=["jingjue", "gua_dict"])' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets
          _random_to_secrets() { sed -i -e 's/random\.sample(/secrets.SystemRandom().sample(/g' -e 's/random\.choice(/secrets.choice(/g' -e 's/\bimport random\b/import secrets/' -e 's/, random,/, secrets,/g' "$1"; }
          _random_to_secrets "jingjue.py"
          tar czf /tmp/pypi-offline/jingjue-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/jingjue_src
          echo "4 kentang2017 packages cloned from GitHub"

          # meihua-yi: 梅花易数, 铜钱起卦用真随机
          pip download --no-deps --no-binary :all: "meihua-yi" -d /tmp/meihua_patch
          cd /tmp/meihua_patch
          tar xfz meihua_yi-*.tar.gz && rm meihua_yi-*.tar.gz
          SRC=$(ls -d meihua_yi-* | head -1)
          sed -i 's/^import random$/import secrets/' "$SRC/meihua_yi/engine.py"
          sed -i 's/random\.choice(/secrets.choice(/g' "$SRC/meihua_yi/engine.py"
          tar czf /tmp/pypi-offline/meihua-yi-patched.tar.gz "$SRC"
          cd /tmp && rm -rf /tmp/meihua_patch
          echo "Added meihua-yi-patched.tar.gz (random → secrets)"

          # arcanite-unified: 统一塔罗引擎 (arcanite+Waite+TarotKit, seed条件分支, Lenormand, DrawnCard proxy 已内置)
          cd /tmp/pypi-offline
          curl -sL https://github.com/heikeyangle-code/arcanite-unified/archive/master.tar.gz -o arcanite-unified.tar.gz 2>&1
          mkdir -p /tmp/arcanite_unified_build
          cd /tmp/arcanite_unified_build
          tar xzf /tmp/pypi-offline/arcanite-unified.tar.gz --strip=1
          dir=/tmp/arcanite_unified_build
          # Strip unused modules (images, LLM, PDF, typst - not needed for AI runtime)
          rm -rf arcanite/images arcanite/interpretation arcanite/render
          rm -rf arcanite/templates arcanite/prompts arcanite/__pycache__
          rm -f arcanite/cards/update_card_positions.py
          # Comment out imports for removed modules
          sed -i 's/from arcanite\.interpretation/### from arcanite.interpretation/' arcanite/__init__.py
          sed -i 's/from arcanite\.render/### from arcanite.render/' arcanite/__init__.py
          sed -i 's/from arcanite\.prompts/### from arcanite.prompts/' arcanite/__init__.py
          sed -i 's/from arcanite\.templates/### from arcanite.templates/' arcanite/__init__.py
          # Now install (patched spreads + stripped)
          pip install . --no-deps 2>&1
          # Fix pydantic version: v2→v1 (Chaquopy uses pydantic<2.0 pure Python, no C extensions)
          sed -i 's/"pydantic>=2.0"/"pydantic<2.0"/' pyproject.toml
          # Re-pack patched tarball (overwrite original — Chaquopy installs from file path)
          cd /tmp/arcanite_unified_build
          tar czf /tmp/pypi-offline/arcanite-unified.tar.gz --exclude=".git" .

          # Rename files to match build.gradle.kts expectations (hyphen→underscore, version pin)
          mkdir -p ${GITHUB_WORKSPACE}/app/offline_pkgs
          for f in /tmp/pypi-offline/*.tar.gz; do
            fname=$(basename "$f")
            # lunar-python → lunar_python (if any lunar-python files appear)
            fname="${fname//lunar-python/lunar_python}"
            fname="${fname//python-dateutil/python_dateutil}"
            fname="${fname//requests-cache/requests_cache}"
            fname="${fname//url-normalize/url_normalize}"
            cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/$fname"
          done
          # No .whl files (all C extensions deleted) — skip
          # Rename unpinned packages to stable names for build.gradle.kts
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/pydantic-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/pydantic-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/lunar_python-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/lunar_python-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/markupsafe-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/markupsafe-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/pyyaml-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/pyyaml-latest.tar.gz" 2>/dev/null || true; done
          # simple_ascii_tables: .whl 改名会破坏 PEP 427 命名规范,保持原名 (resolve via fileTree glob in build.gradle.kts)
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/attrs-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/attrs-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/cattrs-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/cattrs-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/platformdirs-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/platformdirs-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/url_normalize-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/url_normalize-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/urllib3-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/urllib3-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/cn2an-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/cn2an-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/proces-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/proces-latest.tar.gz" 2>/dev/null || true; done
          for f in ${GITHUB_WORKSPACE}/app/offline_pkgs/jinja2-*.tar.gz; do cp "$f" "${GITHUB_WORKSPACE}/app/offline_pkgs/jinja2-latest.tar.gz" 2>/dev/null || true; done
          echo "Offline packages:" && ls ${GITHUB_WORKSPACE}/app/offline_pkgs/
      - name: Compile QiMen TS engine (bigfishmarquis-qimen)
        run: |
          git clone --depth 1 https://github.com/perfhelf/bigfishmarquis-qimen.git /tmp/qimen_ts
          cd /tmp/qimen_ts
          echo 'export { generateQimenChart as generate } from "./src/engine";' > entry.ts
          npm install esbuild typescript lunar-typescript 2>&1 | tail -3
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=QimenEngine --target=es2020 --tree-shaking=false --outfile=qimen-engine.js 2>&1
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp qimen-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Qimen TS engine compiled: $(wc -c < qimen-engine.js) bytes"

      - name: Compile NiHaiXia ZiWei engine (Renhuai123/ziwei-doushu)
        run: |
          git clone --depth 1 https://github.com/Renhuai123/ziwei-doushu.git /tmp/ziwei_nhx
          cd /tmp/ziwei_nhx
          npm install 2>&1 | tail -3
          npm install esbuild typescript 2>&1 | tail -1
          # 完整打包: 算法 + 倪海厦解读 + 古籍
          echo 'export { generateChart, getLunarInfo } from "./lib/ziwei/algorithm";' > entry.ts
          echo 'export * from "./lib/nihai";' >> entry.ts
          echo 'export * from "./lib/classics";' >> entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=ZiweiNihai --target=es2020 --tree-shaking=false --outfile=ziwei-nihai.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp ziwei-nihai.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "NiHaiXia ZiWei engine compiled: $(wc -c < ziwei-nihai.js) bytes"

      - name: Compile IchingShifa JS engine (Coaixy/ichingshifa)
        run: |
          git clone --depth 1 https://github.com/Coaixy/ichingshifa.git /tmp/iching_ts
          cd /tmp/iching_ts
          npm install 2>&1 | tail -3
          npm install esbuild typescript 2>&1 | tail -1
          # Patch Math.random -> crypto.getRandomValues (真随机起卦)
          echo 'function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}' > ~/crypto_random.js
          # 3处 patch:
          # decode.ts:242 Math.floor(Math.random()*5) -> cryptoRandInt(0,4)
          sed -i 's/Math\.floor(Math\.random() \* 5)/cryptoRandInt(0,4)/g' src/core/decode.ts
          # divination.ts:63 Math.floor(Math.random()*(max-min+1))
          sed -i 's/Math\.floor(Math\.random() \* (leftMax - leftMin + 1))/cryptoRandInt(0, leftMax - leftMin)/g' src/core/divination.ts
          # divination.ts:239 Math.floor(Math.random()*48)
          sed -i 's/Math\.floor(Math\.random() \* 48)/cryptoRandInt(0, 47)/g' src/core/divination.ts
          # Verify patch
          grep -n "Math.random" src/core/*.ts && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          echo 'export * from "./src/index";' > entry.ts
          cat ~/crypto_random.js >> entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=IchingShifa --target=es2020 --tree-shaking=false --banner:js="function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}" --outfile=iching-shifa-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp iching-shifa-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "IchingShifa JS engine compiled: $(wc -c < iching-shifa-engine.js) bytes"

      - name: Compile TaiXuan JS engine (taixuan-lib)
        run: |
          mkdir -p /tmp/taixuan_ts
          cd /tmp && npm pack taixuan-lib --pack-destination /tmp/taixuan_ts 2>&1
          cd /tmp/taixuan_ts && tar xzf taixuan-lib-*.tgz && cd package
          # Patch 5处 Math.random -> crypto.getRandomValues
          # 1. randomDigit(): Math.floor(Math.random()*3)+1 -> cryptoRandInt(1,3)
          sed -i 's/Math\.floor(Math\.random() \* 3) + 1/cryptoRandInt(1,3)/g' dist/index.js
          # 2. generateByShi(): Math.floor(Math.random()*48)+1 -> cryptoRandInt(1,48)
          sed -i 's/Math\.floor(Math\.random() \* 48) + 1/cryptoRandInt(1,48)/g' dist/index.js
          # 3. generateByDice(): Math.floor(Math.random()*6)+1 -> cryptoRandInt(1,6)
          sed -i 's/Math\.floor(Math\.random() \* 6) + 1/cryptoRandInt(1,6)/g' dist/index.js
          # 4-5. generateByCoins(): Math.random()<0.5 -> cryptoRandInt(0,1)===1
          sed -i 's/Math\.random() < 0\.5/cryptoRandInt(0,1) === 1/g' dist/index.js
          grep -n "Math.random" dist/index.js && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          # Patch: expose 4-digit code in createResult return (for dual-engine shared random)
          sed -i 's/return { gua: lookupByCode(code), timestamp: Date.now() };/return { gua: lookupByCode(code), timestamp: Date.now(), code: code.join("") };/g' dist/index.js
          grep "code:" dist/index.js && echo "OK: code field exposed" || echo "WARNING: code field patch failed"
          # cryptoRandInt polyfill (injected via esbuild banner)
          echo 'function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}' > /tmp/crypto_polyfill.js
          # Entry: just re-export everything (esbuild handles IIFE wrapping)
          echo 'export * from "./dist/index";' > taixuan-entry.mjs
          npx esbuild taixuan-entry.mjs --bundle --platform=node --format=iife --global-name=TaixuanLib --target=es2020 --tree-shaking=false --banner:js="$(cat /tmp/crypto_polyfill.js)" --outfile=taixuan-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp taixuan-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "TaiXuan JS engine compiled: $(wc -c < taixuan-engine.js) bytes"

      - name: Compile Lunar standalone JS engine
        run: |
          mkdir -p /tmp/lunar_js
          cd /tmp && npm pack lunar-javascript --pack-destination /tmp/lunar_js 2>&1
          cd /tmp/lunar_js && tar xzf lunar-javascript-*.tgz && cd package
          # Export common classes
          # lunar-javascript 是 CommonJS 单文件, 从 index.js 导出即可
          echo 'module.exports = require("./index");' > lunar-entry.cjs
          # 或者用 esbuild 处理 CJS→ESM
          npx esbuild lunar-entry.cjs --bundle --platform=node --format=iife --global-name=Lunar --target=es2020 --tree-shaking=false --outfile=lunar-engine.js 2>&1 | tail -3
          echo "Lunar esbuild done"
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp lunar-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Lunar standalone JS engine compiled: $(wc -c < lunar-engine.js) bytes"

      - name: Compile Astronomy JS engine (astronomy-engine, VSOP87)
        run: |
          mkdir -p /tmp/astronomy_build
          cd /tmp && npm pack astronomy-engine --pack-destination /tmp/astronomy_build 2>&1
          cd /tmp/astronomy_build && tar xzf astronomy-engine-*.tgz && cd package
          echo 'export * from "./astronomy.js";' > astro-entry.mjs
          npx esbuild astro-entry.mjs --bundle --platform=node --format=iife --global-name=Astronomy --target=es2020 --tree-shaking=false --outfile=astronomy-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp astronomy-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Astronomy JS engine compiled: $(wc -c < astronomy-engine.js) bytes"

      - name: Compile Horoscope JS engine (CircularNatalHoroscopeJS)
        run: |
          mkdir -p /tmp/horoscope_build
          cd /tmp && npm pack circular-natal-horoscope-js --pack-destination /tmp/horoscope_build 2>&1
          cd /tmp/horoscope_build && tar xzf circular-natal-horoscope-js-*.tgz && cd package
          echo 'export * from "./dist/index";' > horoscope-entry.mjs
          npx esbuild horoscope-entry.mjs --bundle --platform=node --format=iife --global-name=HoroscopeJS --target=es2020 --tree-shaking=true --outfile=horoscope-engine.js 2>&1 | tail -3
          # QuickJS compat: destructured default params may fail, ensure language fallback
          python3 ${GITHUB_WORKSPACE}/ci/patch_horoscope_quickjs.py horoscope-engine.js
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp horoscope-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Horoscope JS engine compiled: $(wc -c < horoscope-engine.js) bytes"

      - name: Compile Kaabalah JS engine (esoteric — kabbalah/numerology/gematria/ifa/tarot)
        run: |
          mkdir -p /tmp/kaabalah_build
          cd /tmp && npm pack kaabalah --pack-destination /tmp/kaabalah_build 2>&1
          cd /tmp/kaabalah_build && tar xzf kaabalah-*.tgz && cd package
          npm install --production 2>&1 | tail -3
          # Patch: Math.random→crypto (shuffleTarotDeck/shuffleArray 默认RNG用硬件熵)
          sed -i 's/rng = Math\.random/rng = cryptoRandom/g' dist/chunk-GET23WEG.js
          sed -i 's/options\.rng ?? Math\.random/options.rng ?? cryptoRandom/g' dist/chunk-GET23WEG.js
          grep -n "Math.random" dist/chunk-GET23WEG.js && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          # Patch: setTimeout → 删 await sleep (QuickJS无事件循环)
          sed -i 's/async function shuffleTarotDeck/function shuffleTarotDeck/' dist/chunk-GET23WEG.js
          sed -i '/await sleep(shuffleDelay);/d' dist/chunk-GET23WEG.js
          grep -n "await sleep" dist/chunk-GET23WEG.js && echo "WARNING: await sleep still present!" || echo "OK: no await sleep remaining"
          # Patch: getAstrologyTreeMarkers 输入类型检查
          sed -i 's/function getAstrologyTreeMarkers(input) {/function getAstrologyTreeMarkers(input) { if(typeof input!=="object"||!input)return[];/' dist/chunk-4XS3UZEI.js
          # Patch: getNumerologyTreeMarkers 数字→Date
          sed -i 's/function resolveNumerologyInput(input) {/function resolveNumerologyInput(input) { if(typeof input==="number"){input=new Date(input,0,1,12)}if(typeof input==="string"){input=new Date(input+"T12:00:00")}/' dist/chunk-4XS3UZEI.js
          # Patch: getKaabalisticCorrespondenceTargets 空值保护
          sed -i 's/if (lookup.kind === "hebrewLetter") {/if (lookup.kind === "hebrewLetter") { if (!lookup.hebrewLetterId) { return void 0; }/' dist/chunk-4XS3UZEI.js
          sed -i 's/const sign = normalizeSignName(lookup.sign);/const sign = lookup.sign != null ? normalizeSignName(lookup.sign) : void 0;/' dist/chunk-4XS3UZEI.js
          # export * 覆盖全部(含tarot, index.d.ts已re-export所有子模块)
          cat > kaabalah-entry.mjs << 'ENTRYEOF'
          export * from "./dist/index";
          ENTRYEOF
          npx esbuild kaabalah-entry.mjs --bundle --platform=node --format=iife --global-name=Kaabalah --target=es2020 --external:*.wasm --external:tz-lookup --tree-shaking=false --banner:js="function cryptoRandom(){var r=new Uint32Array(1);crypto.getRandomValues(r);return r[0]/4294967296;}" --outfile=kaabalah-engine.js 2>&1
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp kaabalah-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Kaabalah JS engine compiled: $(wc -c < kaabalah-engine.js) bytes"

      - name: Compile Caelus JS engine (Western + Vedic — full-data VSOP87D)
        run: |
          mkdir -p /tmp/caelus_build
          cd /tmp && npm pack caelus --pack-destination /tmp/caelus_build 2>&1
          cd /tmp/caelus_build && tar xzf caelus-*.tgz && cd package
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/

          # Fetch extra data files from GitHub repo (not in npm package)
          echo "Fetching full VSOP87D / asteroid / moon tiers from caelus repo..."
          CAELUS_DATA="https://raw.githubusercontent.com/heavyblotto/caelus/main/packages/caelus/data"
          MISSING=0
          for f in \
            vsop87d_mercury.full.json vsop87d_venus.full.json vsop87d_earth.full.json \
            vsop87d_mars.full.json vsop87d_jupiter.full.json vsop87d_saturn.full.json \
            vsop87d_uranus.full.json vsop87d_neptune.full.json \
            moon_cheb.full.json turbo.json uranian_kepler.json pluto_cheb.json \
            ceres_cheb.json pallas_cheb.json juno_cheb.json vesta_cheb.json pholus_cheb.json; do
            curl -sL "${CAELUS_DATA}/${f}" -o "data/${f}" && echo "  ✓ ${f}" || { echo "  ✗ ${f} FAILED"; MISSING=1; }
          done

          # Fallback: if any file is missing, use embedded-only build (no GitHub data)
          if [ "$MISSING" = "1" ]; then
            echo "⚠️  Some full-data files unavailable — falling back to embedded-only"
            cat > caelus-entry.mjs << 'ENTRYEOF'
          export * from "./dist/src/index.js";
          export { embeddedData } from "./dist/src/data-embedded.js";
          ENTRYEOF
          else
            echo "✅  All full-data files downloaded — building with maximum precision"
            cat > caelus-entry.mjs << 'ENTRYEOF'
          export * from "./dist/src/index.js";
          import { embeddedData } from "./dist/src/data-embedded.js";

          import moonChebFull    from "./data/moon_cheb.full.json"     with { type: "json" };
          import fixedStarsDeep  from "./data/fixed_stars_deep.json"   with { type: "json" };
          import ceresCheb       from "./data/ceres_cheb.json"         with { type: "json" };
          import pallasCheb      from "./data/pallas_cheb.json"        with { type: "json" };
          import junoCheb        from "./data/juno_cheb.json"          with { type: "json" };
          import vestaCheb       from "./data/vesta_cheb.json"         with { type: "json" };
          import pholusCheb      from "./data/pholus_cheb.json"        with { type: "json" };
          import plutoCheb       from "./data/pluto_cheb.json"         with { type: "json" };
          import uranianKepler   from "./data/uranian_kepler.json"     with { type: "json" };
          import turboPack       from "./data/turbo.json"              with { type: "json" };
          import mercuryFull     from "./data/vsop87d_mercury.full.json" with { type: "json" };
          import venusFull       from "./data/vsop87d_venus.full.json"   with { type: "json" };
          import earthFull       from "./data/vsop87d_earth.full.json"   with { type: "json" };
          import marsFull        from "./data/vsop87d_mars.full.json"    with { type: "json" };
          import jupiterFull     from "./data/vsop87d_jupiter.full.json" with { type: "json" };
          import saturnFull      from "./data/vsop87d_saturn.full.json"  with { type: "json" };
          import uranusFull      from "./data/vsop87d_uranus.full.json"  with { type: "json" };
          import neptuneFull     from "./data/vsop87d_neptune.full.json" with { type: "json" };

          const fullData = {
            ...embeddedData,
            moonCheb: moonChebFull,
            deepStars: fixedStarsDeep,
            chebPacks: {
              ceres: ceresCheb, pallas: pallasCheb, juno: junoCheb,
              vesta: vestaCheb, pholus: pholusCheb, pluto: plutoCheb,
            },
            keplerPack: uranianKepler,
            vsop: {
              mercury: mercuryFull, venus: venusFull, earth: earthFull,
              mars: marsFull, jupiter: jupiterFull, saturn: saturnFull,
              uranus: uranusFull, neptune: neptuneFull,
            },
          };

          export { fullData as embeddedData };
          ENTRYEOF
          fi

          npx esbuild caelus-entry.mjs --bundle --platform=node --format=iife --global-name=Caelus --target=es2020 --tree-shaking=false --outfile=caelus-engine.js 2>&1 | tail -5
          cp caelus-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Caelus JS engine compiled (full-data): $(wc -c < caelus-engine.js) bytes"

          # caelus-birth: timezone → UT converter for Caelus charts
          cd /tmp && npm pack caelus-birth --pack-destination /tmp/caelus_build 2>&1
          cd /tmp/caelus_build && tar xzf caelus-birth-*.tgz && cd package
          npm install --production 2>&1 | tail -3
          echo 'export * from "./dist/src/index.js";' > birth-entry.mjs
          npx esbuild birth-entry.mjs --bundle --platform=node --format=iife --global-name=CaelusBirth --target=es2020 --tree-shaking=false --outfile=caelus-birth.js 2>&1 | tail -3
          cp caelus-birth.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Caelus Birth (timezone→UT) compiled: $(wc -c < caelus-birth.js) bytes"

      - name: Compile NatalEngine JS (natalengine — 西洋占星+印度吠陀+Human Design, 依赖astronomy-engine)
        run: |
          mkdir -p /tmp/natalengine_build
          cd /tmp && npm pack natalengine --pack-destination /tmp/natalengine_build 2>&1
          cd /tmp/natalengine_build && tar xzf natalengine-*.tgz && cd package
          # natalengine 依赖 astronomy-engine(我们已有,需安装让esbuild内联)
          npm install astronomy-engine 2>&1 | tail -1
          echo 'export * from "./src/index.js";' > natalentry.mjs
          npx esbuild natalentry.mjs --bundle --platform=node --format=iife --global-name=NatalEngine --target=es2020 --tree-shaking=false --outfile=natalengine-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp natalengine-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "NatalEngine JS engine compiled: $(wc -c < natalengine-engine.js) bytes"

      - name: Compile NodeJhora JS engine (Vedic, QuickJS — bsp由Kotlin注入)
        run: |
          mkdir -p /tmp/nodejhora_build && cd /tmp/nodejhora_build
          npm install @node-jhora/core@2.1.0 @node-jhora/analytics@2.1.0 @node-jhora/prediction@2.1.0 2>&1 | tail -3

          # Patch source files for QuickJS: remove fs/path deps, add buffer support
          python3 ${GITHUB_WORKSPACE}/ci/patch_nodejhora_quickjs.py node_modules

          # Patch ASC formula: atan(y/x)+if cos>0→+180 misses cos<0 cases (nighttime).
          # Replace with Swiss Ephemeris standard atan2(cos, -(sin*cos+tan*sin))
          python3 ${GITHUB_WORKSPACE}/ci/patch_nodejhora_asc.py node_modules

          # Use QuickJS entry file (reads __nodejhora_bsp global injected by Kotlin)
          cp ${GITHUB_WORKSPACE}/ci/jhora_entry_quickjs.mjs ./jhora-entry.mjs

          npx esbuild jhora-entry.mjs \
            --bundle --platform=node --format=iife --global-name=NodeJhora \
            --target=es2020 --tree-shaking=false \
            --outfile=node-jhora-engine.js 2>&1 | tail -3

          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp node-jhora-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "NodeJhora compiled: $(wc -c < node-jhora-engine.js) bytes"

          # Download de440s.bsp separately (NASA JPL, 32MB) — Kotlin injects on demand
          # 注意: NASA 服务器可能限流 CI IP，下载失败不应阻断构建
          # APK 运行时 kotlin 会处理缺失情况
          curl -sL --max-time 60 "https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp" \
            -o ${GITHUB_WORKSPACE}/app/src/main/assets/de440s.bsp \
            && echo "  ✅ de440s.bsp: $(wc -c < ${GITHUB_WORKSPACE}/app/src/main/assets/de440s.bsp) bytes" \
            || echo "  ⚠️ de440s.bsp download failed (non-fatal, Kotlin will handle)"

      - name: Compile Iztro JS engine (SylarLong/iztro ⭐3841 — 紫微斗数权威引擎)
        run: |
          mkdir -p /tmp/iztro_build
          cd /tmp && npm pack iztro --pack-destination /tmp/iztro_build 2>&1
          cd /tmp/iztro_build && tar xzf iztro-*.tgz && cd package
          # iztro 核心9个模块依赖 lunar-lite(农历转换), 必须安装
          npm install lunar-lite 2>&1 | tail -1
          # iztro 是 CJS 模块, lib/index.js 导出 { astro, star, data, util }
          echo 'module.exports = require("./lib/index");' > iztro-entry.cjs
          npx esbuild iztro-entry.cjs --bundle --platform=node --format=iife --global-name=Iztro --target=es2020 --tree-shaking=false --outfile=iztro-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp iztro-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Iztro JS engine compiled: $(wc -c < iztro-engine.js) bytes"


      - name: Compile LiuRen JS engine (look-fate/liuren-ts-lib ⭐9 — 大六壬排盘 TS)
        run: |
          mkdir -p /tmp/liuren_build
          cd /tmp && npm pack liuren-ts-lib --pack-destination /tmp/liuren_build 2>&1
          cd /tmp/liuren_build && tar xzf liuren-ts-lib-*.tgz && cd package
          # liuren-ts-lib 依赖 tyme4ts (农历/干支转换)
          npm install 2>&1 | tail -1
          cp ${GITHUB_WORKSPACE}/ci/liuren-entry.mjs ./entry.mjs
          npx esbuild entry.mjs --bundle --platform=node --format=iife --global-name=LiuRen --target=es2020 --tree-shaking=false --outfile=liuren-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp liuren-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "LiuRen JS engine compiled: $(wc -c < liuren-engine.js) bytes"

      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Extract Chaquopy Python target (for ABI-compatible cross-compile)
        run: |
          chmod +x gradlew
          ./gradlew :app:extractReleasePython --no-daemon 2>&1
          ls -la app/build/python/env/release/include/python3.12/ 2>/dev/null && echo "✅ Chaquopy Python headers available" || { echo "⚠️ Chaquopy headers not found; cross-compile will try python.org fallback (may 404)"; echo "See: python-3.12.3 Android build no longer hosted on python.org"; }
      - name: Cross-compile pyswisseph for Android ARM64
        run: |
          python3 ci/cross_compile_wheels.py 2>&1
          echo "=== offline_pkgs for pyjhora ==="
          ls -la app/offline_pkgs/pyswisseph-*.whl 2>/dev/null
      - name: Download missing Swiss Ephemeris files into pyswisseph wheel
        run: |
          cd /tmp
          WHEEL=$(ls ${GITHUB_WORKSPACE}/app/offline_pkgs/pyswisseph-*.whl 2>/dev/null | head -1)
          if [ -z "$WHEEL" ]; then echo "No pyswisseph wheel found"; exit 0; fi
          mkdir -p ephe_patch
          cd ephe_patch
          unzip -q "$WHEEL" -d swisseph_pkg
          EPHE_DIR="swisseph_pkg/swisseph/ephe"
          mkdir -p "$EPHE_DIR"
          GH_BASE="https://raw.githubusercontent.com/aloistr/swisseph/master/ephe"
          for f in sepl_18.se1 semo_18.se1 seas_18.se1 seplm48.se1 semom48.se1 sepl_36.se1; do
            if [ ! -f "$EPHE_DIR/$f" ]; then
              echo "Downloading $f..."
              curl -sL "$GH_BASE/$f" -o "$EPHE_DIR/$f" && echo "  ✅ $f ($(wc -c < "$EPHE_DIR/$f") bytes)" || echo "  ❌ $f failed"
            else
              echo "  ✅ $f already present"
            fi
          done
          # Re-pack wheel with all ephe files
          cd swisseph_pkg
          zip -rq "$WHEEL" .
          echo "✅ pyswisseph wheel updated with ephe files"
          ls -la "$EPHE_DIR/"
      - name: Patch pyjhora lang resources (embed English strings for Chaquopy)
        run: |
          cd /tmp
          tar xfz ${GITHUB_WORKSPACE}/app/offline_pkgs/pyjhora-4.8.7.tar.gz
          python3 ${GITHUB_WORKSPACE}/ci/patch_pyjhora_lang.py pyjhora-4.8.7
          cd pyjhora-4.8.7
          tar czf ${GITHUB_WORKSPACE}/app/offline_pkgs/pyjhora-4.8.7.tar.gz .
          echo "✅ pyjhora patched: lang resources embedded in utils.py"
      - name: Patch flatlib sweNextTransit (pyswisseph 2.10.x geopos API)
        run: |
          cd /tmp
          unzip -q ${GITHUB_WORKSPACE}/app/offline_pkgs/flatlib-0.2.3-py3-none-any.whl -d flatlib-0.2.3
          python3 ${GITHUB_WORKSPACE}/ci/patch_flatlib_swetransit.py flatlib-0.2.3
          cd flatlib-0.2.3
          zip -qr ${GITHUB_WORKSPACE}/app/offline_pkgs/flatlib-0.2.3-py3-none-any.whl .
          echo "✅ flatlib patched: sweNextTransit uses geopos tuple"
      - name: Build
        run: |
          chmod +x gradlew
          rm -rf app/build/python/  # 清理之前失败构建的脏缓存
          ./gradlew assembleRelease -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
