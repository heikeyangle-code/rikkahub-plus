name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip & setuptools (required for git+ packages)
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Make offline_pkgs discoverable by pip and install Rust for pydantic-core
        run: |
          echo "PIP_FIND_LINKS=file://${GITHUB_WORKSPACE}/app/offline_pkgs" >> $GITHUB_ENV
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          echo "Rust installed: $(rustc --version)"
      - name: Download packages missing from Chaquopy proxy
        run: |
          pip download --no-deps --no-binary :all: "lunar-python==1.4.8" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "sxtwl" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pyswisseph" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pydantic-core" -d /tmp/pypi-offline 2>&1 | tail -3
          # timezonefinder 8.x needs numpy>=2 which isn't on proxy; use 6.0.1 from proxy directly
          mkdir -p app/offline_pkgs
          cp /tmp/pypi-offline/* app/offline_pkgs/
          echo "Offline packages:" && ls app/offline_pkgs/
      - name: Patch humandesign-api (relax strict version pins)
        run: |
          git clone https://github.com/dturkuler/humandesign_api.git /tmp/humandesign_src
          cd /tmp/humandesign_src
          # Relax strict version pins to match Chaquopy proxy availability
          sed -i 's/numpy==2.1.2/numpy>=1.26.2/' pyproject.toml
          sed -i 's/ipython==/ipython>=/' pyproject.toml
          sed -i 's/pandas==2.2.3/pandas>=2.0.0/' pyproject.toml
          sed -i 's/python-dateutil==/python-dateutil>=/' pyproject.toml
          sed -i 's/pytz==/pytz>=/' pyproject.toml
          sed -i 's/tqdm==/tqdm>=/' pyproject.toml
          sed -i 's/uvicorn==/uvicorn>=/' pyproject.toml
          sed -i 's/timezonefinder>=8.2.0/timezonefinder>=3.4.2/' pyproject.toml
          sed -i 's/geopy==/geopy>=/' pyproject.toml
          # Remove dev/lint deps not available on Chaquopy proxy
          sed -i '/"ruff"/d' pyproject.toml
          sed -i '/"pytest"/d' pyproject.toml
          # Remove pydantic dependency (pydantic-core Rust ext unavailable on Chaquopy)
          sed -i '/"pydantic/d' pyproject.toml
          # Replace pydantic BaseModel/Field with dataclasses in schema files
          cat > /tmp/patch_pydantic.py << 'PYEOF'
import re, os, sys

files = [
    "src/humandesign/schemas/v2/calculate.py",
    "src/humandesign/schemas/response_models.py",
]
for fp in files:
    with open(fp) as f:
        lines = f.readlines()
    new_lines = []
    for line in lines:
        if re.match(r'^class \w+\(BaseModel\):', line):
            new_lines.append('@dataclass\n')
            new_lines.append(re.sub(r'\(BaseModel\)', '', line))
        elif 'from pydantic import BaseModel, Field' in line:
            new_lines.append('from dataclasses import dataclass, field\n')
        elif 'Field(' in line:
            new_lines.append(line.replace('Field(', 'field('))
        else:
            new_lines.append(line)
    with open(fp, 'w') as f:
        f.writelines(new_lines)

# Patch masking.py for model_dump
mp = "src/humandesign/services/masking.py"
with open(mp) as f:
    content = f.read()
content = content.replace('.model_dump(exclude_none=True)', '.model_dump_shim()')
with open(mp, 'w') as f:
    f.write(content)

# Add import for shim
with open(mp) as f:
    lines = f.readlines()
lines.insert(0, 'from humandesign.pydantic_shim import model_dump_shim\n')
with open(mp, 'w') as f:
    f.writelines(lines)

# Create shim module
shim_path = "src/humandesign/pydantic_shim.py"
with open(shim_path, 'w') as f:
    f.write('''from dataclasses import asdict

def model_dump_shim(obj, *, exclude_none=True):
    """Replacement for pydantic's model_dump using dataclasses.asdict."""
    result = asdict(obj)
    if exclude_none:
        return {k: v for k, v in result.items() if v is not None}
    return result
''')
print("Patched pydantic usage in humandesign-api")
PYEOF
          python3 /tmp/patch_pydantic.py
          # Keep pyswisseph pin — we provide the exact version via offline tarball
          sed -i 's|pyswisseph.*|pyswisseph==2.10.3.2",|' pyproject.toml
          echo "Patched pyproject.toml:"
          grep -E '".*==' pyproject.toml || true
          cd /tmp && tar czf /tmp/pypi-offline/humandesign-api-patched.tar.gz humandesign_src
          cp /tmp/pypi-offline/humandesign-api-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          echo "Added humandesign-api-patched.tar.gz"
      - name: Patch kinwangji (relax ephem pin)
        run: |
          git clone https://github.com/kentang2017/kinwangji.git /tmp/kinwangji_src
          cd /tmp/kinwangji_src
          sed -i 's/ephem>=4.1.6/ephem>=4.1.5/' pyproject.toml 2>/dev/null || sed -i 's/ephem>=4.1.6/ephem>=4.1.5/' setup.py 2>/dev/null || true
          echo "Patched kinwangji:"
          grep -n 'ephem' pyproject.toml setup.py setup.cfg 2>/dev/null || true
          cd /tmp && tar czf /tmp/pypi-offline/kinwangji-patched.tar.gz kinwangji_src
          cp /tmp/pypi-offline/kinwangji-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          echo "Added kinwangji-patched.tar.gz"
      - name: Patch stellium (relax timezonefinder pin)
        run: |
          pip download --no-deps --no-binary :all: stellium -d /tmp/st_patch
          cd /tmp/st_patch
          tar xfz stellium-*.tar.gz
          rm stellium-*.tar.gz
          cd stellium-*
          sed -i 's/timezonefinder>=6.5.0/timezonefinder>=6.0.0/' pyproject.toml
          # Remove deps unavailable on Chaquopy proxy
          sed -i '/\"typst\"/d' pyproject.toml
          sed -i '/\"graphviz\"/d' pyproject.toml
          echo "Patched stellium:"
          grep "timezonefinder" pyproject.toml
          cd /tmp/st_patch && tar czf /tmp/pypi-offline/stellium-patched.tar.gz stellium-*
          cp /tmp/pypi-offline/stellium-patched.tar.gz ${GITHUB_WORKSPACE}/app/offline_pkgs/
          rm -rf /tmp/st_patch
          echo "Added stellium-patched.tar.gz"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :web:buildWebUi --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*.apk
