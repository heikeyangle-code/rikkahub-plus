          npx esbuild natalentry.mjs --bundle --platform=node --format=iife --global-name=NatalEngine --target=es2020 --tree-shaking=false --outfile=natalengine-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
