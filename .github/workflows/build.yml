          echo "Iztro JS engine compiled: $(wc -c < iztro-engine.js) bytes"

      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Extract Chaquopy Python target (for ABI-compatible cross-compile)
        run: |
          chmod +x gradlew
          ./gradlew :app:extractReleasePython --no-daemon 2>&1 | tail -10
          ls -la app/build/python/env/release/include/python3.14/ 2>/dev/null && echo "✅ Chaquopy Python headers available" || echo "⚠️ Chaquopy headers not found, will fall back to python.org"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
