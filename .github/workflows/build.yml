name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip & setuptools (required for git+ packages)
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :web:buildWebUi --stacktrace 2>&1 | tee build.log | tail -20
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*.apk
