      - name: Compile Kaabalah JS engine (esoteric — kabbalah/numerology/gematria/ifa/tarot)
        run: |
          mkdir -p /tmp/kaabalah_build
          cd /tmp && npm pack kaabalah --pack-destination /tmp/kaabalah_build 2>&1
          cd /tmp/kaabalah_build && tar xzf kaabalah-*.tgz && cd package
          npm install --production 2>&1 | tail -3
          # Patch: Math.random→crypto (shuffleTarotDeck/shuffleArray 默认RNG用硬件熵)
          sed -i 's/rng = Math\.random/rng = cryptoRandom/g' dist/chunk-M2FTEWY2.js
          sed -i 's/options\.rng ?? Math\.random/options.rng ?? cryptoRandom/g' dist/chunk-M2FTEWY2.js
          grep -n "Math.random" dist/chunk-M2FTEWY2.js && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          # 只导出纯JS可用部分 (排除WASM依赖的占星 + SVG绘图)
          cat > kaabalah-entry.mjs << 'ENTRYEOF'
          export {
            SPHERES, SPHERES_DATA, FOUR_WORLDS, FOUR_WORLDS_DATA,
            HEBREW_LETTERS, HEBREW_LETTERS_DATA, LATIN_LETTERS, LATIN_LETTERS_DATA,
            LURIANIC_PATHS, MELKITZEDEKI_PATHS,
            TreeOfLife, TreeTopology, TREE_SPHERE_IDS, TREE_PATH_IDS,
            buildKaabalisticMapData, getCanonicalTree, getTreeLayout, getTreeTopology,
            getAstrologyTreeMarkers, getGematriaTreeMarkers, getNumerologyTreeMarkers,
            calculateKaabalisticLifePath, calculateStraightAcrossReductionLifePath,
            getKaabalisticCorrespondenceTargets,
            calculateGematria, reverseGematria, GematriaData,
            calculatePersonalYear, calculatePersonalMonths, calculatePersonalCycles,
            calculateChallenges, calculateCycles, calculateFibonacciCycle,
            reduceToSingle, reduceToSingleWithSteps, isMasterNumber, getDateEnergies,
            MASTER_NUMBERS, NumerologyData,
            calculateOdu
          } from "./dist/index";
          ENTRYEOF
          npx esbuild kaabalah-entry.mjs --bundle --platform=node --format=iife --global-name=Kaabalah --target=es2020 --external:*.wasm --tree-shaking=false --banner:js="function cryptoRandom(){var r=new Uint32Array(1);crypto.getRandomValues(r);return r[0]/4294967296;}" --outfile=kaabalah-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp kaabalah-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Kaabalah JS engine compiled: $(wc -c < kaabalah-engine.js) bytes"

      - name: Compile Caelus JS engine (Western + Vedic astrology — zero-dependency VSOP87D)
        run: |
          mkdir -p /tmp/caelus_build
          cd /tmp && npm pack caelus --pack-destination /tmp/caelus_build 2>&1
          cd /tmp/caelus_build && tar xzf caelus-*.tgz && cd package
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          # data-embedded.js is NOT re-exported by index.js — create custom entry
          echo 'export * from "./dist/src/index.js";' > caelus-entry.mjs
          echo 'export { embeddedData } from "./dist/src/data-embedded.js";' >> caelus-entry.mjs
          npx esbuild caelus-entry.mjs --bundle --platform=node --format=iife --global-name=Caelus --target=es2020 --tree-shaking=false --outfile=caelus-engine.js 2>&1 | tail -3
          cp caelus-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Caelus JS engine compiled: $(wc -c < caelus-engine.js) bytes"

          # caelus-birth: timezone → UT converter for Caelus charts
          cd /tmp && npm pack caelus-birth --pack-destination /tmp/caelus_build 2>&1
          cd /tmp/caelus_build && tar xzf caelus-birth-*.tgz && cd package
          npm install --production 2>&1 | tail -3
          echo 'export * from "./dist/src/index.js";' > birth-entry.mjs
