name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip & setuptools (required for git+ packages)
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Download packages missing from Chaquopy proxy
        run: |
          pip download --no-deps --no-binary :all: "lunar-python==1.4.8" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "sxtwl" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pyswisseph" -d /tmp/pypi-offline 2>&1 | tail -3
          mkdir -p app/offline_pkgs
          cp /tmp/pypi-offline/* app/offline_pkgs/
          echo "Offline packages:" && ls app/offline_pkgs/
      - name: Patch humandesign-api (relax strict version pins)
        run: |
          git clone https://github.com/dturkuler/humandesign_api.git /tmp/humandesign_src
          cd /tmp/humandesign_src
          # Relax numpy==2.1.2 → numpy>=1.26.2, pandas==2.2.3 → pandas>=2.0.0, etc.
          sed -i 's/==/>=/g' pyproject.toml
          # Keep pyswisseph pin — we provide the exact version via offline tarball
          sed -i 's|pyswisseph.*|pyswisseph==2.10.3.2",|' pyproject.toml
          echo "Patched pyproject.toml:"
          grep -E "\".*==" pyproject.toml || true
          cd /tmp && tar czf /tmp/pypi-offline/humandesign-api-patched.tar.gz -C /tmp humandesign_src
          cp /tmp/pypi-offline/humandesign-api-patched.tar.gz app/offline_pkgs/
          echo "Added humandesign-api-patched.tar.gz"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Write signing config
        run: |
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :web:buildWebUi --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*.apk
