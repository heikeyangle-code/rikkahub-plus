      - name: Compile Horoscope JS engine (CircularNatalHoroscopeJS)
        run: |
          mkdir -p /tmp/horoscope_build
          cd /tmp && npm pack circular-natal-horoscope-js --pack-destination /tmp/horoscope_build 2>&1
          cd /tmp/horoscope_build && tar xzf circular-natal-horoscope-js-*.tgz && cd package
          echo 'export * from "./dist/index";' > horoscope-entry.mjs
          npx esbuild horoscope-entry.mjs --bundle --platform=node --format=iife --global-name=HoroscopeJS --target=es2020 --tree-shaking=true --outfile=horoscope-engine.js 2>&1 | tail -3
          # QuickJS compat: destructured default params may fail, ensure language fallback
          python3 ${GITHUB_WORKSPACE}/ci/patch_horoscope_quickjs.py horoscope-engine.js
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp horoscope-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
