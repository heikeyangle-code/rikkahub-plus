          npx esbuild astro-entry.mjs --bundle --platform=node --format=iife --global-name=Astronomy --target=es2020 --tree-shaking=false --outfile=astronomy-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp astronomy-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
