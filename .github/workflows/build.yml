name: Build APK

on:
  push:
    branches: [ master, mingli ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Upgrade pip & setuptools (required for git+ packages)
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Make offline_pkgs discoverable by pip and install Rust for pydantic-core
        run: |
          echo "PIP_FIND_LINKS=file://${GITHUB_WORKSPACE}/app/offline_pkgs" >> $GITHUB_ENV
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          echo "Rust installed: $(rustc --version)"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Download packages missing from Chaquopy proxy
        run: |
          pip download --no-deps --no-binary :all: "lunar-python" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "pydantic<2.0" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "PyYAML" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "MarkupSafe" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "attrs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "cattrs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "platformdirs" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "url-normalize" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "urllib3" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "jinja2" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "cn2an" -d /tmp/pypi-offline 2>&1 | tail -3
          pip download --no-deps --no-binary :all: "proces" -d /tmp/pypi-offline 2>&1 | tail -3
          # Strip C extensions from PyYAML & MarkupSafe — sdist compiles on x86_64 CI runner,
          # producing x86_64 .so files that can't load on ARM64 devices.
          # Both have pure-Python fallbacks; force those by removing ext_modules.
          for pkg in PyYAML MarkupSafe; do
            cd /tmp/pypi-offline
            tarball=$(ls ${pkg}-*.tar.gz 2>/dev/null | head -1)
            [ -z "$tarball" ] && continue
            tar xfz "$tarball" && rm "$tarball"
            srcdir=$(ls -d ${pkg}-* | head -1)
            sed -i 's/ext_modules=\[/ext_modules=\[\]  # /' "$srcdir/setup.py" 2>/dev/null || true
            sed -i 's/\[tool.setuptools.ext-modules\]/### [tool.setuptools.ext-modules]/' "$srcdir/pyproject.toml" 2>/dev/null || true
            tar czf "$tarball" "$srcdir" && rm -rf "$srcdir"
            echo "Patched $pkg: C extension disabled (pure Python fallback)"
            cd ${GITHUB_WORKSPACE}
          done
          # ichingshifa: PyPI 残缺版, GitHub克隆+补__init__.py+替换ephem.Date
          git clone --depth 1 https://github.com/kentang2017/ichingshifa.git /tmp/ichingshifa_src 2>&1 | tail -3
          cd /tmp/ichingshifa_src
          # Flatten: mv src/ichingshifa → ./ichingshifa (Chaquopy pip install broken with package_dir)
          mv src/ichingshifa ./ichingshifa && rm -rf src
          # Fix empty __init__.py (original is 1-byte newline → no exports)
          printf 'from .ichingshifa import *\nfrom .d import *\nfrom .jieqi import *\n' > ichingshifa/__init__.py
          printf 'from setuptools import setup; setup(name="ichingshifa", version="0.1", packages=["ichingshifa"], package_data={"ichingshifa": ["*.pkl"]})' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets (SystemRandom uses OS entropy)
          sed -i 's/\brandom\.sample(/secrets.SystemRandom().sample(/g' ichingshifa/ichingshifa.py
          sed -i 's/import pickle, random,/import pickle, secrets,/' ichingshifa/ichingshifa.py
          # ephem.Date → 纯Python: ephem 是已删C扩展, 只用到 Date() 解析日期字符串
          python3 ${GITHUB_WORKSPACE}/ci/patch_ichingshifa_ephem.py ichingshifa/ichingshifa.py
          # 纯 Python 替换 numpy (np.array_split)
          python3 ${GITHUB_WORKSPACE}/ci/patch_pyjhora_numpy.py /tmp/ichingshifa_src/ichingshifa/
          # jieqi.py: 重写为 lunar_python 实现 (ephem C扩展已删, Sun+Ecliptic+Equatorial全依赖ephem)
          python3 ${GITHUB_WORKSPACE}/ci/patch_ichingshifa_jieqi.py ichingshifa/jieqi.py
          # bookgua_string() + count_yy 干支校验
          python3 ${GITHUB_WORKSPACE}/ci/patch_ichingshifa_improve.py ichingshifa/ichingshifa.py
          tar czf /tmp/pypi-offline/ichingshifa-src.tar.gz --exclude=".git" . 2>&1
          cd /tmp && rm -rf /tmp/ichingshifa_src
          echo "ichingshifa full tarball ready (__init__ + ephem.Date patched + jieqi→lunar_python)"

          # kinliuren (大六壬): GitHub克隆,纯Python零依赖(146KB)
          git clone --depth 1 https://github.com/kentang2017/kinliuren.git /tmp/kinliuren_src 2>&1 | tail -1
          cd /tmp/kinliuren_src
          mv src/kinliuren ./kinliuren && rm -rf src
          # Fix empty __init__.py (original is 3-byte → no exports)
          printf 'from .kinliuren import *\n' > kinliuren/__init__.py
          # 干支参数校验: __init__ + all_sike 前置检查
          python3 ${GITHUB_WORKSPACE}/ci/patch_kinliuren_improve.py kinliuren/kinliuren.py
          printf 'from setuptools import setup; setup(name="kinliuren", version="0.1", packages=["kinliuren"])' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          tar czf /tmp/pypi-offline/kinliuren-0.1.2.9.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/kinliuren_src
          echo "kinliuren from GitHub ready (146KB, __init__ fixed)"

          # taixuanshifa (太玄筮法): PyPI空壳, GitHub克隆+注入setup.py
          # Fix: 用packages代替py_modules, data/自动随包部署 (py_modules不处理package_data)
          git clone --depth 1 https://github.com/kentang2017/taixuanshifa.git /tmp/taixuanshifa_src 2>&1 | tail -1
          cd /tmp/taixuanshifa_src
          mkdir -p taixuanshifa && mv taixuanshifa.py taixuanshifa/__init__.py && mv app.py taixuanshifa/ 2>/dev/null || true
          mv data taixuanshifa/data
          printf 'from setuptools import setup; setup(name="taixuanshifa", version="0.1", packages=["taixuanshifa"], package_data={"taixuanshifa": ["data/*"]})' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets
          sed -i 's/\brandom\.sample(/secrets.SystemRandom().sample(/g' taixuanshifa/__init__.py
          sed -i 's/import random, pickle,/import secrets, pickle,/' taixuanshifa/__init__.py
          # Fix: __file__ 路径适配新包结构
          sed -i 's|root = os.path.abspath(os.path.dirname(__file__))|root = os.path.dirname(os.path.abspath(__file__))|' taixuanshifa/__init__.py
          python3 ${GITHUB_WORKSPACE}/ci/patch_taixuanshifa_inject.py taixuanshifa/__init__.py
          grep "pan_from_code" taixuanshifa/__init__.py && echo "OK: pan_from_code injected" || echo "FAIL: injection missed"
          tar czf /tmp/pypi-offline/taixuanshifa-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/taixuanshifa_src

          # jingjue (荆诀/北大简先秦占卜): PyPI空壳, GitHub克隆+注入setup.py (根目录.py, 非src/)
          git clone --depth 1 https://github.com/kentang2017/jingjue.git /tmp/jingjue_src 2>&1 | tail -1
          cd /tmp/jingjue_src
          printf 'from setuptools import setup; setup(name="jingjue", version="0.1", py_modules=["jingjue", "gua_dict"])' > setup.py
          printf '[build-system]\nrequires = ["setuptools"]\nbuild-backend = "setuptools.build_meta"\n' > pyproject.toml
          # 真随机: random → secrets
          _random_to_secrets() { sed -i -e 's/random\.sample(/secrets.SystemRandom().sample(/g' -e 's/random\.choice(/secrets.choice(/g' -e 's/\bimport random\b/import secrets/' -e 's/, random,/, secrets,/g' "$1"; }
          _random_to_secrets "jingjue.py"
          tar czf /tmp/pypi-offline/jingjue-src.tar.gz --exclude=".git" .
          cd /tmp && rm -rf /tmp/jingjue_src
          echo "4 kentang2017 packages cloned from GitHub"

          # meihua-yi: 梅花易数, 铜钱起卦用真随机
          pip download --no-deps --no-binary :all: "meihua-yi" -d /tmp/meihua_patch
          cd /tmp/meihua_patch
          tar xfz meihua_yi-*.tar.gz && rm meihua_yi-*.tar.gz
          SRC=$(ls -d meihua_yi-* | head -1)
          sed -i 's/^import random$/import secrets/' "$SRC/meihua_yi/engine.py"
          sed -i 's/random\.choice(/secrets.choice(/g' "$SRC/meihua_yi/engine.py"
          tar czf /tmp/pypi-offline/meihua-yi-patched.tar.gz "$SRC"
          cd /tmp && rm -rf /tmp/meihua_patch
          echo "Added meihua-yi-patched.tar.gz (random → secrets)"

          # arcanite: 塔罗引擎, 删掉LLM+PDF+图片以外的内容 + pydantic v2→v1 patch
          pip download --no-deps --no-binary :all: "arcanite==0.2.0" -d /tmp/pypi-offline 2>&1
          cd /tmp/pypi-offline
          sdist=$(ls arcanite-*.tar.gz | head -1)
          dir="${sdist%.tar.gz}"
          tar xfz "$sdist" && rm "$sdist"
          rm -rf "$dir/src/arcanite/interpretation"
          rm -rf "$dir/src/arcanite/render"
          rm -rf "$dir/src/arcanite/templates"
          rm -rf "$dir/src/arcanite/prompts"
          rm -f "$dir/src/arcanite/cards/update_card_positions.py"
          rm -rf "$dir/src/arcanite/images"
          rm -rf "$dir/examples"
          # 真随机: random.Random(seed) → secrets.SystemRandom() (seed=None 时走硬件熵)
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_random.py "$dir/src/arcanite/core/deck.py"
          # pydantic v2→v1: 降级 models.py 以消除 pydantic_core Rust C扩展依赖
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_pydantic_v1.py "$dir/src/arcanite/core/models.py"
          # pydantic metadata: 改 dependency 声明避免 pip 解析冲突 (sed 避 yaml colon)
          sed -i 's/"pydantic>=2.0"/"pydantic<2.0"/' "$dir/pyproject.toml"
          # Lenormand card_id/id 兼容: 塔罗用card_id, 雷诺曼用id (字段名不同, 都需支持)
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_lenormand.py "$dir/src/arcanite/core/deck.py"
          # LenormandCard + LenormandDeck + load_lenormand_deck() (10 semantic getters)
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_lenormand_deck.py "$dir/src/arcanite/core/deck.py"
          # Lenormand __init__ exports + lenormand/ subpackage (fix ImportError + ModuleNotFoundError)
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_lenormand_init.py "$dir/src/arcanite/core/__init__.py" "$dir/src/arcanite"
          # SpreadPosition 4 optional fields: index, key, is_significator, mirror_target
          python3 ${GITHUB_WORKSPACE}/ci/patch_spread_position_fields.py "$dir/src/arcanite/core/models.py" "$dir/src/arcanite/core/spread.py"
          # Spread system parameter: list_spreads(system=) + load_spread(id, system=) (fix TypeError + KeyError)
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_spread.py "$dir/src/arcanite/core/spread.py"
          # DrawnCard proxy: _deck_ref + TarotCard methods (get_affirmations etc.) on DrawnCard
          python3 ${GITHUB_WORKSPACE}/ci/patch_arcanite_drawncard_proxy.py "$dir/src/arcanite/core/models.py" "$dir/src/arcanite/core/deck.py"
          # Grand Tableau spread: register 36 houses as formal spread in lenormand-spreads.json
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_grand_tableau.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # line-7 spread: 7-card extended linear reading
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_line7.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # line-9 spread: 9-card full linear reading
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_line9.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # 3x3 Box spread: 9-card grid (mind/action/foundation)
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_box3x3.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # Cross spread: 5-card center+left+right+bottom+top
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_cross.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # Astrological Houses: 12-card 4x3 grid
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_houses12.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # Relationship spread: 5-card querent+other+dynamic+friction+trajectory
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_relationship.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # Enhance line-3: add index/key/is_significator/mirror_target
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_enhance_line3.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # Enhance line-5: add index/key/is_significator/mirror_target
          python3 ${GITHUB_WORKSPACE}/ci/patch_lenormand_enhance_line5.py "$dir/src/arcanite/spreads/lenormand-spreads.json"
          # Fix: preserve original __init__.py structure, only strip broken imports (render/prompts/images)
          # Instead of full rewrite, keep original and just comment out unavailable subpackages
          if [ -f "$dir/src/arcanite/__init__.py" ]; then
            sed -i 's/from arcanite\.interpretation/### from arcanite.interpretation/' "$dir/src/arcanite/__init__.py"
            sed -i 's/from arcanite\.render/### from arcanite.render/' "$dir/src/arcanite/__init__.py"
            sed -i 's/from arcanite\.prompts/### from arcanite.prompts/' "$dir/src/arcanite/__init__.py"
            sed -i 's/from arcanite\.templates/### from arcanite.templates/' "$dir/src/arcanite/__init__.py"
            echo "Patched __init__.py (disabled unavailable subpackages)"
          fi
          tar czf "/tmp/pypi-offline/arcanite-pydantic-v1.tar.gz" "$dir"
          rm -rf "$dir"
          cd ${GITHUB_WORKSPACE}
          echo "arcanite pydantic-v1 ready"

          # Rename files to match build.gradle.kts expectations (hyphen→underscore, version pin)
          mkdir -p app/offline_pkgs
          for f in /tmp/pypi-offline/*.tar.gz; do
            fname=$(basename "$f")
            # lunar-python → lunar_python (if any lunar-python files appear)
            fname="${fname//lunar-python/lunar_python}"
            fname="${fname//python-dateutil/python_dateutil}"
            fname="${fname//requests-cache/requests_cache}"
            fname="${fname//url-normalize/url_normalize}"
            cp "$f" "app/offline_pkgs/$fname"
          done
          # No .whl files (all C extensions deleted) — skip
          # Rename unpinned packages to stable names for build.gradle.kts
          for f in app/offline_pkgs/pydantic-*.tar.gz; do cp "$f" "app/offline_pkgs/pydantic-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/lunar_python-*.tar.gz; do cp "$f" "app/offline_pkgs/lunar_python-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/markupsafe-*.tar.gz; do cp "$f" "app/offline_pkgs/markupsafe-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/pyyaml-*.tar.gz; do cp "$f" "app/offline_pkgs/pyyaml-latest.tar.gz" 2>/dev/null || true; done
          # simple_ascii_tables: .whl 改名会破坏 PEP 427 命名规范,保持原名 (resolve via fileTree glob in build.gradle.kts)
          for f in app/offline_pkgs/attrs-*.tar.gz; do cp "$f" "app/offline_pkgs/attrs-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/cattrs-*.tar.gz; do cp "$f" "app/offline_pkgs/cattrs-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/platformdirs-*.tar.gz; do cp "$f" "app/offline_pkgs/platformdirs-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/url_normalize-*.tar.gz; do cp "$f" "app/offline_pkgs/url_normalize-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/urllib3-*.tar.gz; do cp "$f" "app/offline_pkgs/urllib3-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/cn2an-*.tar.gz; do cp "$f" "app/offline_pkgs/cn2an-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/proces-*.tar.gz; do cp "$f" "app/offline_pkgs/proces-latest.tar.gz" 2>/dev/null || true; done
          for f in app/offline_pkgs/jinja2-*.tar.gz; do cp "$f" "app/offline_pkgs/jinja2-latest.tar.gz" 2>/dev/null || true; done
          echo "Offline packages:" && ls app/offline_pkgs/
      - name: Compile QiMen TS engine (bigfishmarquis-qimen)
        run: |
          git clone --depth 1 https://github.com/perfhelf/bigfishmarquis-qimen.git /tmp/qimen_ts
          cd /tmp/qimen_ts
          echo 'export { generateQimenChart as generate } from "./src/engine";' > entry.ts
          npm install esbuild typescript lunar-typescript 2>&1 | tail -3
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=QimenEngine --target=es2020 --tree-shaking=false --outfile=qimen-engine.js 2>&1
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp qimen-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Qimen TS engine compiled: $(wc -c < qimen-engine.js) bytes"

      - name: Compile NiHaiXia ZiWei engine (Renhuai123/ziwei-doushu)
        run: |
          git clone --depth 1 https://github.com/Renhuai123/ziwei-doushu.git /tmp/ziwei_nhx
          cd /tmp/ziwei_nhx
          npm install 2>&1 | tail -3
          npm install esbuild typescript 2>&1 | tail -1
          # 完整打包: 算法 + 倪海厦解读 + 古籍
          echo 'export { generateChart, getLunarInfo } from "./lib/ziwei/algorithm";' > entry.ts
          echo 'export * from "./lib/nihai";' >> entry.ts
          echo 'export * from "./lib/classics";' >> entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=ZiweiNihai --target=es2020 --tree-shaking=false --outfile=ziwei-nihai.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp ziwei-nihai.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "NiHaiXia ZiWei engine compiled: $(wc -c < ziwei-nihai.js) bytes"

      - name: Compile IchingShifa JS engine (Coaixy/ichingshifa)
        run: |
          git clone --depth 1 https://github.com/Coaixy/ichingshifa.git /tmp/iching_ts
          cd /tmp/iching_ts
          npm install 2>&1 | tail -3
          npm install esbuild typescript 2>&1 | tail -1
          # Patch Math.random -> crypto.getRandomValues (真随机起卦)
          echo 'function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}' > ~/crypto_random.js
          # 3处 patch:
          # decode.ts:242 Math.floor(Math.random()*5) -> cryptoRandInt(0,4)
          sed -i 's/Math\.floor(Math\.random() \* 5)/cryptoRandInt(0,4)/g' src/core/decode.ts
          # divination.ts:63 Math.floor(Math.random()*(max-min+1))
          sed -i 's/Math\.floor(Math\.random() \* (leftMax - leftMin + 1))/cryptoRandInt(0, leftMax - leftMin)/g' src/core/divination.ts
          # divination.ts:239 Math.floor(Math.random()*48)
          sed -i 's/Math\.floor(Math\.random() \* 48)/cryptoRandInt(0, 47)/g' src/core/divination.ts
          # Verify patch
          grep -n "Math.random" src/core/*.ts && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          echo 'export * from "./src/index";' > entry.ts
          cat ~/crypto_random.js >> entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=iife --global-name=IchingShifa --target=es2020 --tree-shaking=false --banner:js="function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}" --outfile=iching-shifa-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp iching-shifa-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "IchingShifa JS engine compiled: $(wc -c < iching-shifa-engine.js) bytes"

      - name: Compile TaiXuan JS engine (taixuan-lib)
        run: |
          mkdir -p /tmp/taixuan_ts
          cd /tmp && npm pack taixuan-lib --pack-destination /tmp/taixuan_ts 2>&1
          cd /tmp/taixuan_ts && tar xzf taixuan-lib-*.tgz && cd package
          # Patch 5处 Math.random -> crypto.getRandomValues
          # 1. randomDigit(): Math.floor(Math.random()*3)+1 -> cryptoRandInt(1,3)
          sed -i 's/Math\.floor(Math\.random() \* 3) + 1/cryptoRandInt(1,3)/g' dist/index.js
          # 2. generateByShi(): Math.floor(Math.random()*48)+1 -> cryptoRandInt(1,48)
          sed -i 's/Math\.floor(Math\.random() \* 48) + 1/cryptoRandInt(1,48)/g' dist/index.js
          # 3. generateByDice(): Math.floor(Math.random()*6)+1 -> cryptoRandInt(1,6)
          sed -i 's/Math\.floor(Math\.random() \* 6) + 1/cryptoRandInt(1,6)/g' dist/index.js
          # 4-5. generateByCoins(): Math.random()<0.5 -> cryptoRandInt(0,1)===1
          sed -i 's/Math\.random() < 0\.5/cryptoRandInt(0,1) === 1/g' dist/index.js
          grep -n "Math.random" dist/index.js && echo "WARNING: Math.random still present!" || echo "OK: no Math.random remaining"
          # Patch: expose 4-digit code in createResult return (for dual-engine shared random)
          sed -i 's/return { gua: lookupByCode(code), timestamp: Date.now() };/return { gua: lookupByCode(code), timestamp: Date.now(), code: code.join("") };/g' dist/index.js
          grep "code:" dist/index.js && echo "OK: code field exposed" || echo "WARNING: code field patch failed"
          # cryptoRandInt polyfill (injected via esbuild banner)
          echo 'function cryptoRandInt(min,max){var r=new Uint32Array(1);crypto.getRandomValues(r);return min+(r[0]%(max-min+1));}' > /tmp/crypto_polyfill.js
          # Entry: just re-export everything (esbuild handles IIFE wrapping)
          echo 'export * from "./dist/index";' > taixuan-entry.mjs
          npx esbuild taixuan-entry.mjs --bundle --platform=node --format=iife --global-name=TaixuanLib --target=es2020 --tree-shaking=false --banner:js="$(cat /tmp/crypto_polyfill.js)" --outfile=taixuan-engine.js 2>&1 | tail -3
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp taixuan-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "TaiXuan JS engine compiled: $(wc -c < taixuan-engine.js) bytes"

      - name: Compile Lunar standalone JS engine
        run: |
          mkdir -p /tmp/lunar_js
          cd /tmp && npm pack lunar-javascript --pack-destination /tmp/lunar_js 2>&1
          cd /tmp/lunar_js && tar xzf lunar-javascript-*.tgz && cd package
          # Export common classes
          # lunar-javascript 是 CommonJS 单文件, 从 index.js 导出即可
          echo 'module.exports = require("./index");' > lunar-entry.cjs
          # 或者用 esbuild 处理 CJS→ESM
          npx esbuild lunar-entry.cjs --bundle --platform=node --format=iife --global-name=Lunar --target=es2020 --tree-shaking=false --outfile=lunar-engine.js 2>&1 | tail -3
          echo "Lunar esbuild done"
          mkdir -p ${GITHUB_WORKSPACE}/app/src/main/assets/
          cp lunar-engine.js ${GITHUB_WORKSPACE}/app/src/main/assets/
          echo "Lunar standalone JS engine compiled: $(wc -c < lunar-engine.js) bytes"

      - name: Compile Astronomy JS engine (astronomy-engine, VSOP87)
        run: |
          mkdir -p /tmp/astronomy_build
          cd /tmp && npm pack astronomy-engine --pack-destination /tmp/astronomy_build 2>&1
          cd /tmp/astronomy_build && tar xzf astronomy-engine-*.tgz && cd package
